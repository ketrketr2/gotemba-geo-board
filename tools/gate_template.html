<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>御殿場GEOボード — 認証</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23081020'/><path d='M14 74 L38 34 Q42 27 46 34 L50 41 L54 34 Q58 27 62 34 L86 74 Z' fill='none' stroke='%23FF7A59' stroke-width='6' stroke-linejoin='round'/><path d='M38 46 L43 40 L47 45 L52 39 L57 45 L62 46' fill='none' stroke='%23FFC24B' stroke-width='5' stroke-linecap='round'/></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{overflow-x:hidden;max-width:100%;}
@media(max-width:900px){input{font-size:16px!important;}}
body{min-height:100vh;display:grid;place-items:center;padding:24px;
 background:radial-gradient(1000px 620px at 50% -8%, #14263E 0%, transparent 58%), #060B15;
 color:#EAF1FB;font-family:'BIZ UDPGothic','BIZ UDGothic','Hiragino Sans',Meiryo,sans-serif;}
.card{width:100%;max-width:400px;background:linear-gradient(160deg,#141F36,#0E1626 65%);border:1px solid #1D2A44;border-radius:18px;
 padding:34px 30px 28px;box-shadow:0 30px 80px rgba(2,7,16,.6);position:relative;overflow:hidden;}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#FF7A59,#FFC24B 60%,transparent 90%);}
.mk{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin-bottom:16px;background:#0B1424;border:1px solid #2C3E63;}
h1{font-size:20px;letter-spacing:.05em;} h1 span{background:linear-gradient(92deg,#FF7A59,#FFC24B);-webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{font-size:11px;color:#5E7192;letter-spacing:.16em;margin-top:3px;margin-bottom:24px;font-family:'JetBrains Mono',monospace;}
label{display:block;font-size:11px;color:#9DB0CE;margin:14px 0 6px;font-weight:700;}
input{width:100%;background:#0B1322;border:1px solid #2C3E63;color:#EAF1FB;font-family:inherit;font-size:14px;padding:12px 14px;border-radius:10px;outline:none;transition:.15s;}
input:focus{border-color:#FF7A59;box-shadow:0 0 0 3px rgba(255,122,89,.16);}
button{width:100%;margin-top:22px;background:linear-gradient(145deg,#FF7A59,#E85B3F);color:#160803;border:none;font-family:inherit;font-weight:800;font-size:14px;letter-spacing:.05em;padding:13px;border-radius:10px;cursor:pointer;transition:.15s;}
button:hover{filter:brightness(1.08);} button:disabled{opacity:.6;cursor:wait;}
.err{color:#FF6B87;font-size:12px;margin-top:14px;min-height:16px;text-align:center;}
.ft{font-size:10px;color:#5E7192;text-align:center;margin-top:20px;line-height:1.7;}
.ft a{color:#FF9A6B;text-decoration:none;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(22,8,3,.35);border-top-color:#160803;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="card">
  <div class="mk"><svg width="30" height="30" viewBox="0 0 100 100" fill="none"><path d="M12 76 L38 32 Q43 24 48 32 L52 39 L56 32 Q61 24 66 32 L88 76" stroke="#FF7A59" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 45 L43 38 L48 44 L54 37 L60 44 L65 45" stroke="#FFC24B" stroke-width="5.5" stroke-linecap="round"/></svg></div>
  <h1>御殿場<span>GEOボード</span></h1>
  <div class="sub">GOTEMBA × AI × VOICE</div>
  <form id="f" autocomplete="off">
    <label for="u">ID</label>
    <input id="u" type="text" autocomplete="username" spellcheck="false" autocapitalize="none">
    <label for="p">パスワード</label>
    <input id="p" type="password" autocomplete="current-password">
    <button id="b" type="submit">ログイン</button>
    <div class="err" id="e"></div>
  </form>
  <div class="ft">認証済みユーザー専用。データは暗号化されています。<br>不明な場合は管理者（<a href="mailto:nakai@slashslash.jp">nakai@slashslash.jp</a>）へお問い合わせください。</div>
</div>
<script>
const BLOB="__BLOB__";
const ITER=200000;
function b64d(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
async function decrypt(u,p){
 const data=b64d(BLOB);
 const salt=data.slice(0,16), iv=data.slice(16,28), ct=data.slice(28);
 const enc=new TextEncoder();
 const km=await crypto.subtle.importKey('raw',enc.encode(u+':'+p),{name:'PBKDF2'},false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
 const ds=new DecompressionStream('gzip');
 const stream=new Blob([plain]).stream().pipeThrough(ds);
 return await new Response(stream).text();
}
const f=document.getElementById('f'),e=document.getElementById('e'),b=document.getElementById('b');
f.addEventListener('submit',async ev=>{
 ev.preventDefault();
 const u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
 if(!u||!p){e.textContent='IDとパスワードを入力してください';return;}
 b.disabled=true;b.innerHTML='<span class="spin"></span>復号中…';e.textContent='';
 try{
   const html=await decrypt(u,p);
   if(html.indexOf('GOTEMBA_BOARD')===-1) throw new Error('bad');
   document.open();document.write(html);document.close();
 }catch(err){
   e.textContent='IDまたはパスワードが正しくありません';
   b.disabled=false;b.textContent='ログイン';
 }
});
document.getElementById('u').focus();
</script>
</body>
</html>
