name: adhoc_probe

# 単発スタディ用: 任意のクエリ群を AI4面に1回ずつ投げ、結果JSONを artifact に出す。
# data/snapshots には書かない（ボードの時系列を汚さない）。コミットもしない。
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "クエリ定義JSONのパス"
        default: "tools/adhoc_queries_suncare.json"
      cap:
        description: "この1回の支払上限（USD）"
        default: "6"
      faces:
        description: "面（カンマ区切り）"
        default: "chatgpt,gemini,aio,aimode"

permissions:
  contents: read

concurrency:
  group: gotemba-geo
  cancel-in-progress: false

jobs:
  adhoc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 鍵の有無を確認
        env:
          L: ${{ secrets.DATAFORSEO_LOGIN }}
          P: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          if [ -z "$L" ] || [ -z "$P" ]; then
            echo "::error::DATAFORSEO_LOGIN / DATAFORSEO_PASSWORD が未登録です"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Probe
        env:
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          python tools/adhoc_probe.py --queries "${{ inputs.queries }}" \
            --cap "${{ inputs.cap }}" --faces "${{ inputs.faces }}" --out out/adhoc.json

      - uses: actions/upload-artifact@v4
        with:
          name: adhoc-probe
          path: out/adhoc.json
          retention-days: 7
