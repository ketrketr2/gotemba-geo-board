<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>御殿場GEOボード</title>
<!--GOTEMBA_BOARD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet"></noscript>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23081020'/><path d='M14 74 L38 34 Q42 27 46 34 L50 41 L54 34 Q58 27 62 34 L86 74 Z' fill='none' stroke='%23FF7A59' stroke-width='6' stroke-linejoin='round'/><path d='M38 46 L43 40 L47 45 L52 39 L57 45 L62 46' fill='none' stroke='%23FFC24B' stroke-width='5' stroke-linecap='round'/></svg>">
<style>
:root{
 --bg:#060B15; --bg2:#0A1120; --panel:#0E1626; --panel2:#141F36; --line:#1D2A44; --line2:#2C3E63;
 --tx:#EAF1FB; --tx2:#9DB0CE; --tx3:#5E7192;
 --ac:#FF7A59; --ac2:#E85B3F; --gold:#FFC24B;
 --gpt:#17A469; --gem:#7A64EE; --aio:#0C8FA8; --aim:#C8850A;
 --gn:#3DDC97; --rd:#FF6B87; --bl:#4E9BE8; --pu:#B48CFF; --cy:#22C7D6;
 --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{overflow-x:hidden;max-width:100%;}
body{background:var(--bg);color:var(--tx);font-family:'BIZ UDPGothic','BIZ UDGothic','Hiragino Sans',Meiryo,sans-serif;font-size:14px;min-height:100vh;position:relative;}
a{color:var(--cy);text-decoration:none;} a:hover{text-decoration:underline;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
mark{background:linear-gradient(transparent 55%, rgba(255,194,75,.38) 55%);color:inherit;padding:0 2px;border-radius:2px;font-weight:700;}
mark.r{background:linear-gradient(transparent 55%, rgba(255,107,135,.32) 55%);}
mark.g{background:linear-gradient(transparent 55%, rgba(61,220,151,.30) 55%);}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:6px;}
::selection{background:rgba(255,122,89,.35);}
::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:#22314E;border-radius:99px;} ::-webkit-scrollbar-track{background:transparent;}

/* ===== ambient layers ===== */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.8;}
.aur{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;opacity:.5;mix-blend-mode:screen;animation:drift 26s ease-in-out infinite alternate;}
.a1{width:640px;height:520px;top:-190px;right:-120px;background:radial-gradient(circle at 40% 40%, rgba(255,122,89,.34), transparent 65%);}
.a2{width:560px;height:560px;bottom:-230px;left:16%;background:radial-gradient(circle at 50% 50%, rgba(76,110,245,.20), transparent 65%);animation-duration:32s;animation-delay:-8s;}
.a3{width:420px;height:420px;top:32%;left:-160px;background:radial-gradient(circle at 50% 50%, rgba(255,194,75,.16), transparent 65%);animation-duration:38s;animation-delay:-16s;}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1);}to{transform:translate3d(-50px,36px,0) scale(1.12);}}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
 radial-gradient(1300px 760px at 74% -12%, #142640 0%, transparent 58%),
 radial-gradient(900px 600px at -8% 108%, #101B31 0%, transparent 55%);}

/* ===== splash ===== */
#splash{position:fixed;inset:0;z-index:200;background:radial-gradient(900px 600px at 50% 42%, #0E1B30 0%, var(--bg) 70%);display:grid;place-items:center;transition:opacity .5s ease .06s;}
#splash.off{opacity:0;pointer-events:none;}
#splash .in{text-align:center;}
#splash svg{display:block;margin:0 auto 14px;}
#splash .fj{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1s cubic-bezier(.5,0,.2,1) .05s forwards;}
#splash .fj2{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .7s ease .6s forwards;}
@keyframes dr{to{stroke-dashoffset:0;}}
#splash h1{font-size:15px;letter-spacing:.34em;color:var(--tx2);font-weight:700;opacity:0;animation:fu .6s ease .55s forwards;}
#splash p{font-size:9.5px;letter-spacing:.5em;color:var(--tx3);margin-top:8px;opacity:0;animation:fu .6s ease .8s forwards;font-family:var(--mono);}
@keyframes fu{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ===== sample ribbon ===== */
.ribbon{position:sticky;top:0;z-index:90;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:7px 14px;font-size:11px;letter-spacing:.05em;background:linear-gradient(90deg, rgba(255,122,89,.16), rgba(255,194,75,.14) 50%, rgba(255,122,89,.16));border-bottom:1px solid rgba(255,178,32,.35);backdrop-filter:blur(8px);color:#FFD9A8;}
.ribbon b{color:#FFC24B;}
.ribbon .dot{width:7px;height:7px;border-radius:99px;background:var(--gold);animation:pulse 1.8s ease infinite;flex:none;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,194,75,.55);}55%{box-shadow:0 0 0 7px rgba(255,194,75,0);}}

/* ===== layout ===== */
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;position:relative;z-index:1;}
.side{background:linear-gradient(180deg, rgba(13,22,38,.92), rgba(9,15,28,.92));backdrop-filter:blur(10px);border-right:1px solid var(--line);padding:20px 13px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin;}
.logo{display:flex;gap:11px;align-items:center;padding:0 8px;}
.logo .mk{width:42px;height:42px;border-radius:13px;background:linear-gradient(148deg,#101B30,#0B1424);border:1px solid var(--line2);display:grid;place-items:center;flex:none;box-shadow:0 8px 22px rgba(0,0,0,.45), inset 0 0 18px rgba(255,122,89,.08);}
.logo h1{font-size:14.5px;line-height:1.3;letter-spacing:.02em;}
.logo h1 b{background:linear-gradient(92deg,var(--ac),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
.logo .sub{font-size:8.5px;color:var(--tx3);letter-spacing:.22em;font-family:var(--mono);margin-top:2px;}
.rsel{margin:14px 6px 2px;display:flex;gap:8px;align-items:center;background:#0B1322;border:1px solid var(--line);border-radius:11px;padding:8px 10px;}
.rsel .lbl{font-size:9px;color:var(--tx3);letter-spacing:.14em;flex:none;}
.rsel select{flex:1;min-width:0;background:transparent;border:none;color:var(--tx);font-family:inherit;font-size:11.5px;outline:none;}
.rsel select option{background:#0E1626;}
.nav{margin-top:12px;}
.nav .sec{font-size:8.5px;color:var(--tx3);letter-spacing:.24em;margin:15px 9px 6px;font-weight:700;font-family:var(--mono);}
.nv{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:11px;border:1px solid transparent;background:none;color:var(--tx2);font-family:inherit;font-size:12.5px;cursor:pointer;text-align:left;transition:.16s;position:relative;overflow:hidden;}
.nv:hover{background:#111C31;color:var(--tx);transform:translateX(2px);}
.nv.on{background:linear-gradient(115deg, rgba(255,122,89,.16), rgba(255,122,89,.04) 70%);border-color:rgba(255,122,89,.45);color:var(--tx);font-weight:700;}
.nv.on:before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--ac),var(--gold));}
.nv .ic{width:18px;text-align:center;flex:none;opacity:.9;}
.nv .bd{margin-left:auto;font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:99px;background:#0B1424;border:1px solid var(--line2);color:var(--tx2);flex:none;}
.nv .bd.smp{color:var(--gold);border-color:rgba(255,194,75,.4);}
.nv .bd.real{color:var(--gn);border-color:rgba(61,220,151,.45);}
.nv .bd.prop{color:var(--cy);border-color:rgba(34,199,214,.45);}
.sfoot{margin-top:20px;padding:12px 10px 4px;border-top:1px dashed var(--line);font-size:9.5px;color:var(--tx3);line-height:1.95;}
.sfoot b{color:var(--tx2);font-family:var(--mono);}

/* ===== main ===== */
.main{padding:18px 26px 70px;min-width:0;position:relative;}
.ticker{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg, rgba(14,22,38,.9), rgba(14,22,38,.55));border:1px solid var(--line);border-radius:12px;padding:8px 13px;margin-bottom:16px;overflow:hidden;}
.ticker .live{flex:none;display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.18em;color:var(--rd);font-family:var(--mono);font-weight:800;}
.ticker .live i{width:7px;height:7px;border-radius:99px;background:var(--rd);animation:pulse 1.6s ease infinite;}
.ticker .tk{flex:1;min-width:0;font-size:11.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:1;transition:opacity .35s ease;}
.ticker .tk.sw{opacity:0;}
.ticker .tk b{color:var(--tx);}
.ticker .n{flex:none;font-family:var(--mono);font-size:9.5px;color:var(--tx3);}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.crumb h2{font-size:21px;letter-spacing:.02em;}
.crumb h2 small{font-size:10.5px;color:var(--tx3);font-weight:400;margin-left:10px;letter-spacing:.12em;font-family:var(--mono);}
.chip{font-size:10.5px;color:var(--tx2);background:rgba(14,22,38,.8);border:1px solid var(--line);padding:4px 11px;border-radius:99px;}
.chip b{color:var(--ac);font-family:var(--mono);}
.hbtn{margin-left:auto;background:var(--panel);border:1px solid var(--line2);color:var(--cy);border-radius:99px;width:30px;height:30px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;flex:none;}
.hbtn:hover{background:#16233B;transform:scale(1.08) rotate(8deg);}

/* ===== cards ===== */
.g{display:grid;gap:14px;}
.card{background:linear-gradient(168deg, rgba(20,31,54,.86), rgba(14,22,38,.86) 70%);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;min-width:0;backdrop-filter:blur(6px);overflow:hidden;}
.card:after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg, transparent, rgba(255,255,255,.045), transparent);transform:skewX(-18deg);transition:left .7s ease;pointer-events:none;}
.card:hover:after{left:130%;}
.card:hover{border-color:var(--line2);}
.card.hl:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;border-radius:3px 0 0 3px;background:linear-gradient(180deg,var(--ac),transparent);}
.ct{font-size:12px;font-weight:700;color:var(--tx2);letter-spacing:.05em;display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.ct .q{cursor:pointer;color:var(--cy);border:1px solid var(--line2);border-radius:99px;width:17px;height:17px;display:inline-grid;place-items:center;font-size:10px;flex:none;background:none;font-family:inherit;}
.ct .q:hover{background:#16233B;}
.tag{display:inline-block;font-size:8.5px;padding:2px 8px;border-radius:99px;letter-spacing:.1em;font-family:var(--mono);font-weight:800;flex:none;}
.tag.smp{color:#0B0E05;background:linear-gradient(92deg,var(--gold),#F0A518);}
.tag.real{color:#04120C;background:linear-gradient(92deg,var(--gn),#17A469);}
.tag.prop{color:#03141A;background:linear-gradient(92deg,#5FD9E8,var(--cy));}
.src{font-size:9px;color:var(--tx3);margin-top:10px;line-height:1.8;}
.src a{color:#7FA3C8;}
.kpi{font-family:var(--mono);font-size:27px;font-weight:800;letter-spacing:-.01em;}
.kpi small{font-size:12px;color:var(--tx3);font-weight:600;margin-left:3px;}
.sub2{font-size:10.5px;color:var(--tx3);margin-top:5px;line-height:1.7;}
.delta{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid;margin-left:8px;vertical-align:3px;}
.delta.up{color:var(--gn);border-color:rgba(61,220,151,.4);} .delta.dn{color:var(--rd);border-color:rgba(255,107,135,.4);} .delta.fl{color:var(--tx3);border-color:var(--line2);}
.up{color:var(--gn);} .dn{color:var(--rd);} .act{color:var(--ac);} .cyt{color:var(--cy);} .glt{color:var(--gold);}
.rv{opacity:0;transform:translateY(16px) scale(.995);}
.rv.on{opacity:1;transform:none;transition:opacity .6s cubic-bezier(.16,.84,.28,1), transform .6s cubic-bezier(.16,.84,.28,1);}
/* ===== hero ===== */
.hero{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;}
.ring{position:relative;width:196px;height:196px;margin:6px auto 2px;}
.ring svg{transform:rotate(-90deg);}
.ringbg{fill:none;stroke:#0B1424;stroke-width:13;}
.ringfg{fill:none;stroke:url(#gAc);stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.25,1);filter:drop-shadow(0 0 8px rgba(255,122,89,.5));}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;}
.ring .mid .v{font-family:var(--mono);font-size:46px;font-weight:800;line-height:1;background:linear-gradient(180deg,#FFF2E8,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
.ring .mid .l{font-size:10px;color:var(--tx2);margin-top:6px;letter-spacing:.14em;}
.fuji-wm{position:absolute;right:-12px;bottom:-16px;opacity:.12;pointer-events:none;}
.ktiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;}
.kt{background:rgba(10,17,31,.7);border:1px solid var(--line);border-radius:13px;padding:12px 14px;position:relative;transition:.18s;min-width:0;}
.kt:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.4);}
.kt .t{font-size:9.5px;color:var(--tx3);letter-spacing:.1em;display:flex;gap:6px;align-items:center;}
.kt .t i{width:8px;height:8px;border-radius:3px;flex:none;}
.kt .v{font-family:var(--mono);font-size:22px;font-weight:800;margin-top:5px;}
.kt .v small{font-size:10.5px;color:var(--tx3);font-weight:600;}
.kt .s{font-size:9px;color:var(--tx3);margin-top:3px;line-height:1.6;}
.kt svg{position:absolute;right:10px;bottom:9px;opacity:.85;}

/* ===== alerts ===== */
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:rgba(10,17,31,.7);border:1px solid var(--line);border-left:3px solid var(--rd);border-radius:12px;padding:11px 14px;transition:.18s;}
.alert:hover{transform:translateX(3px);border-color:var(--line2);}
.alert.mid{border-left-color:var(--gold);}
.alert .sev{font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.14em;color:var(--rd);border:1px solid rgba(255,107,135,.45);padding:3px 8px;border-radius:99px;flex:none;}
.alert.mid .sev{color:var(--gold);border-color:rgba(255,194,75,.4);}
.alert .tx{font-size:12px;line-height:1.7;color:var(--tx);}
.alert .tx small{display:block;font-size:9.5px;color:var(--tx3);margin-top:2px;}
.qchip{display:inline-flex;align-items:center;gap:7px;background:rgba(10,17,31,.75);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:11px;color:var(--tx);margin:3px 4px 3px 0;transition:.15s;}
.qchip:hover{border-color:var(--line2);transform:translateY(-2px);}
.qchip .ar{font-family:var(--mono);font-weight:800;}
.qchip .dm{font-family:var(--mono);font-size:9px;color:var(--tx3);}

/* ===== bars & charts ===== */
.gbar{height:9px;border-radius:99px;background:#0A1322;overflow:hidden;position:relative;}
.gbar i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.16,.84,.28,1);background:linear-gradient(90deg,var(--ac2),var(--ac));position:relative;}
.gbar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,rgba(255,255,255,.28) 92%,transparent);opacity:.55;}
.brow{display:grid;grid-template-columns:112px minmax(0,1fr) 58px;gap:10px;align-items:center;padding:6px 0;}
.brow .bl2{font-size:11px;color:var(--tx2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brow.me .bl2{color:var(--tx);font-weight:700;}
.brow .bv{font-family:var(--mono);font-size:11.5px;font-weight:700;text-align:right;}
path.draw{stroke-dasharray:1;stroke-dashoffset:1;}
path.draw.go{stroke-dashoffset:0;transition:stroke-dashoffset 1.25s cubic-bezier(.4,0,.2,1);}
.afill{opacity:0;transition:opacity .8s ease .55s;}
.afill.go{opacity:1;}
svg text{font-family:'BIZ UDPGothic',sans-serif;}
svg .mono, svg text.mn{font-family:'JetBrains Mono',monospace;}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:9.5px;color:var(--tx3);margin-top:9px;}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.hovrect{cursor:crosshair;}

/* ===== faces ===== */
.face{background:rgba(10,17,31,.7);border:1px solid var(--line);border-radius:14px;padding:13px 15px;position:relative;overflow:hidden;transition:.2s;min-width:0;}
.face:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(0,0,0,.42);}
.face:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--fc,var(--ac));opacity:.85;}
.face .nm{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;}
.face .nm i{width:9px;height:9px;border-radius:99px;background:var(--fc);box-shadow:0 0 10px var(--fc);flex:none;}
.face .met{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:11px;}
.face .met .m .a{font-size:8.5px;color:var(--tx3);letter-spacing:.08em;}
.face .met .m .b{font-family:var(--mono);font-size:16.5px;font-weight:800;margin-top:2px;}
.face .met .m .b small{font-size:9px;color:var(--tx3);}
.face .nt{font-size:9px;color:var(--tx3);margin-top:9px;border-top:1px dashed var(--line);padding-top:7px;line-height:1.7;}

/* ===== matrix ===== */
.mwrap{overflow-x:auto;padding-bottom:6px;}
.mx{border-collapse:separate;border-spacing:3px;min-width:660px;width:100%;}
.mx th{font-size:9.5px;color:var(--tx3);font-weight:700;padding:4px 6px;white-space:nowrap;}
.mx th.rowh{text-align:right;font-size:10.5px;color:var(--tx2);padding-right:10px;}
.hcell{width:56px;height:34px;border-radius:8px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:800;cursor:pointer;opacity:0;transform:scale(.6);border:1px solid transparent;}
.hcell.on{opacity:1;transform:scale(1);transition:opacity .45s ease, transform .45s cubic-bezier(.34,1.4,.5,1);}
.hcell:hover{border-color:rgba(255,255,255,.4);box-shadow:0 0 0 2px rgba(255,255,255,.12);}
.mx td.non{color:var(--tx3);text-align:center;font-size:10px;}

/* ===== radar & donut ===== */
.rpoly{transform-origin:50% 50%;transform:scale(.5);opacity:0;transform-box:fill-box;}
.rpoly.on{transform:scale(1);opacity:1;transition:transform .9s cubic-bezier(.2,.9,.3,1.1), opacity .6s ease;}
.dseg{opacity:0;}
.dseg.on{opacity:1;transition:opacity .5s ease;}
.gbr{transform:scaleY(0);transform-origin:center bottom;transform-box:fill-box;}
.gbr.go{transform:scaleY(1);transition:transform .75s cubic-bezier(.2,.85,.3,1);}
.gbl{opacity:0;}
.gbl.go{opacity:1;transition:opacity .45s ease;}
.seg{display:inline-flex;background:#0B1322;border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px;}
.seg button{border:none;background:none;color:var(--tx2);font-family:inherit;font-size:10.5px;padding:5px 13px;border-radius:99px;cursor:pointer;transition:.16s;white-space:nowrap;}
.seg button:hover{color:var(--tx);}
.seg button.on{background:linear-gradient(92deg,var(--ac2),var(--ac));color:#160803;font-weight:700;box-shadow:0 4px 14px rgba(255,122,89,.35);}
.gstat{display:inline-flex;gap:6px;align-items:center;background:rgba(10,17,31,.75);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:10px;color:var(--tx3);}
.gstat b{font-family:var(--mono);font-size:12px;color:var(--tx);}
/* ===== 連携（工事中）ゴースト ===== */
.nv.ghost{opacity:.58;}
.nv.ghost:hover{opacity:.95;}
.bd.lock{color:#C9A96A;border-style:dashed;border-color:rgba(255,194,75,.4);}
.lockwrap{position:relative;min-height:300px;}
.ghosted{opacity:.38;filter:saturate(.45) brightness(.9);pointer-events:none;user-select:none;}
.lockover{position:absolute;inset:0;display:grid;place-items:center;z-index:5;padding:18px;}

function lcHover(ev,id,pl,pw,n){

 const vx=(ev.clientX-r.left)*sx;

function radar(series,size){

 });

function donut(parts,size,label,sub){
 const tot=parts.reduce((a,b)=>a+b.v,0)||1, r=size/2-14, cx=size/2, cy=size/2;
 let a0=-Math.PI/2,g='';
 parts.forEach((p,i)=>{
  const frac=p.v/tot, a1=a0+frac*Math.PI*2, gap=0.028;
  const x0=cx+r*Math.cos(a0+gap),y0=cy+r*Math.sin(a0+gap),x1=cx+r*Math.cos(a1-gap),y1=cy+r*Math.sin(a1-gap);
  const big=(a1-a0)>Math.PI?1:0;
  if(p.v>0)g+=`<path class="dseg" d="M${x0.toFixed(1)},${y0.toFixed(1)}A${r},${r} 0 ${big} 1 ${x1.toFixed(1)},${y1.toFixed(1)}" fill="none" stroke="${p.c}" stroke-width="16" stroke-linecap="round"
    onmousemove="tip('<b>${esc(p.n)}</b>: ${p.v}%',event)" onmouseleave="untip()" style="pointer-events:stroke"/>`;
  a0=a1;
 });
 g+=`<text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="19" font-weight="800" fill="#EAF1FB" class="mn">${label}</text><text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="8.5" fill="#5E7192">${esc(sub)}</text>`;
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;margin:0 auto">${g}</svg>`;
}

 const resize=()=>{W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';};
 resize();addEventListener('resize',resize);
 for(let i=0;i<46;i++)ps.push({x:Math.random(),y:Math.random(),r:(Math.random()*1.6+.5)*devicePixelRatio,s:Math.random()*.00022+.00007,tw:Math.random()*Math.PI*2,g:Math.random()<.28});
 let run=true;
 document.addEventListener('visibilitychange',()=>{run=!document.hidden;if(run)requestAnimationFrame(loop);});
 function loop(t){
  if(!run)return;
  ctx.clearRect(0,0,W,H);
  ps.forEach(p=>{
   p.y-=p.s;if(p.y<-.02){p.y=1.02;p.x=Math.random();}
   const a=(Math.sin(t/1400+p.tw)+1)/2*.5+.12;
   ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.r,0,7);
   ctx.fillStyle=p.g?`rgba(255,194,75,${a})`:`rgba(158,187,228,${a*.8})`;
   ctx.fill();
  });
  requestAnimationFrame(loop);
 }
 requestAnimationFrame(loop);
}
init();

</script>
</body>
